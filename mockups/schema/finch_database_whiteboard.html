<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Finch Database Schema Whiteboard</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #667085;
      --surface: rgba(255, 255, 255, 0.92);
      --border: rgba(23, 32, 51, 0.14);
      --accent: #5b5bd6;
      --grid: rgba(42, 54, 84, 0.10);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f8fafc;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button { font: inherit; }

    .whiteboard {
      position: fixed;
      inset: 0;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      user-select: none;
      background-color: #f8fafc;
      background-image: radial-gradient(circle, var(--grid) 1.15px, transparent 1.15px);
      background-size: 24px 24px;
    }

    .whiteboard.is-dragging { cursor: grabbing; }

    .canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: max-content;
      height: max-content;
      transform-origin: 0 0;
      will-change: transform;
    }

    .canvas img {
      display: block;
      width: 2319.2109375px;
      height: 1601.5px;
      max-width: none;
      pointer-events: none;
      filter: drop-shadow(0 18px 38px rgba(23, 32, 51, 0.08));
    }

    .toolbar {
      position: fixed;
      z-index: 10;
      top: max(16px, env(safe-area-inset-top));
      left: max(16px, env(safe-area-inset-left));
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 10px 30px rgba(23, 32, 51, 0.12);
      backdrop-filter: blur(14px);
    }

    .toolbar button,
    .zoom-value {
      display: grid;
      min-width: 38px;
      height: 38px;
      place-items: center;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--ink);
    }

    .toolbar button {
      cursor: pointer;
      font-size: 20px;
      font-weight: 650;
    }

    .toolbar button:hover,
    .toolbar button:focus-visible {
      outline: none;
      background: rgba(91, 91, 214, 0.10);
      color: var(--accent);
    }

    .toolbar .fit-button {
      min-width: auto;
      padding: 0 12px;
      font-size: 13px;
    }

    .zoom-value {
      min-width: 54px;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .divider {
      width: 1px;
      height: 24px;
      background: var(--border);
    }

    .help {
      position: fixed;
      z-index: 10;
      right: max(16px, env(safe-area-inset-right));
      bottom: max(16px, env(safe-area-inset-bottom));
      margin: 0;
      padding: 8px 11px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface);
      color: var(--muted);
      box-shadow: 0 8px 24px rgba(23, 32, 51, 0.08);
      font-size: 12px;
      backdrop-filter: blur(14px);
    }

    @media (max-width: 640px) {
      .toolbar {
        top: max(10px, env(safe-area-inset-top));
        left: max(10px, env(safe-area-inset-left));
      }

      .help { display: none; }
    }

    @media print {
      .toolbar,
      .help { display: none; }

      .whiteboard {
        position: static;
        overflow: visible;
        background: white;
      }
    }
  </style>
</head>
<body>
  <main id="whiteboard" class="whiteboard" aria-label="Interactive Finch database schema whiteboard">
    <div id="canvas" class="canvas">
      <img id="diagram" src="finch_database_whiteboard.svg" width="2319.2109375" height="1601.5" alt="Entity relationship diagram for the Finch intake database schema" draggable="false">
    </div>
  </main>

  <nav class="toolbar" aria-label="Whiteboard controls">
    <button id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">−</button>
    <output id="zoom-value" class="zoom-value" aria-live="polite">100%</output>
    <button id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">+</button>
    <span class="divider" aria-hidden="true"></span>
    <button id="fit" class="fit-button" type="button" aria-label="Fit diagram to screen" title="Fit diagram to screen">Fit</button>
  </nav>

  <p class="help">Drag to pan · Scroll to zoom · Double-click to fit</p>

  <script>
    (() => {
      const viewport = document.getElementById("whiteboard");
      const canvas = document.getElementById("canvas");
      const diagram = document.getElementById("diagram");
      const zoomValue = document.getElementById("zoom-value");
      const diagramWidth = 2319.2109375;
      const diagramHeight = 1601.5;
      const minScale = 0.12;
      const maxScale = 3;
      let scale = 1;
      let x = 0;
      let y = 0;
      let pointerId = null;
      let lastX = 0;
      let lastY = 0;

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function applyTransform() {
        canvas.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${scale})`;
        zoomValue.value = `${Math.round(scale * 100)}%`;
        zoomValue.textContent = zoomValue.value;
      }

      function fitToScreen() {
        const viewportWidth = viewport.clientWidth;
        const viewportHeight = viewport.clientHeight;
        const padding = viewportWidth < 640 ? 24 : 80;
        scale = clamp(
          Math.min(
            (viewportWidth - padding * 2) / diagramWidth,
            (viewportHeight - padding * 2) / diagramHeight
          ),
          minScale,
          1.25
        );
        x = (viewportWidth - diagramWidth * scale) / 2;
        y = (viewportHeight - diagramHeight * scale) / 2;
        applyTransform();
      }

      function zoomAt(nextScale, clientX, clientY) {
        const previousScale = scale;
        scale = clamp(nextScale, minScale, maxScale);
        const worldX = (clientX - x) / previousScale;
        const worldY = (clientY - y) / previousScale;
        x = clientX - worldX * scale;
        y = clientY - worldY * scale;
        applyTransform();
      }

      function zoomFromCenter(factor) {
        zoomAt(
          scale * factor,
          viewport.clientWidth / 2,
          viewport.clientHeight / 2
        );
      }

      viewport.addEventListener("wheel", (event) => {
        event.preventDefault();
        const factor = Math.exp(-event.deltaY * 0.0022);
        zoomAt(scale * factor, event.clientX, event.clientY);
      }, { passive: false });

      viewport.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;
        pointerId = event.pointerId;
        lastX = event.clientX;
        lastY = event.clientY;
        viewport.setPointerCapture(pointerId);
        viewport.classList.add("is-dragging");
      });

      viewport.addEventListener("pointermove", (event) => {
        if (event.pointerId !== pointerId) return;
        x += event.clientX - lastX;
        y += event.clientY - lastY;
        lastX = event.clientX;
        lastY = event.clientY;
        applyTransform();
      });

      function endDrag(event) {
        if (event.pointerId !== pointerId) return;
        pointerId = null;
        viewport.classList.remove("is-dragging");
      }

      viewport.addEventListener("pointerup", endDrag);
      viewport.addEventListener("pointercancel", endDrag);
      viewport.addEventListener("dblclick", fitToScreen);

      document.getElementById("zoom-in").addEventListener("click", () => zoomFromCenter(1.22));
      document.getElementById("zoom-out").addEventListener("click", () => zoomFromCenter(1 / 1.22));
      document.getElementById("fit").addEventListener("click", fitToScreen);

      window.addEventListener("keydown", (event) => {
        if (event.key === "+" || event.key === "=") zoomFromCenter(1.22);
        if (event.key === "-") zoomFromCenter(1 / 1.22);
        if (event.key === "0" || event.key.toLowerCase() === "f") fitToScreen();
      });

      window.addEventListener("resize", fitToScreen);
      if (diagram.complete) fitToScreen();
      else diagram.addEventListener("load", fitToScreen, { once: true });
    })();
  </script>
</body>
</html>
